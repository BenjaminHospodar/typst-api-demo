[package]
name    = "typst-compiler-svc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio          = { version = "1", features = ["full"] }
tonic          = "0.11"
prost          = "0.12"
redis          = { version = "0.25", features = ["tokio-comp", "streams"] }
typst          = "0.12"
typst-pdf      = "0.12"
typst-assets   = { version = "0.12", features = ["fonts"] }
serde_json     = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid           = { version = "1", features = ["v4"] }
anyhow         = "1"

[build-dependencies]
tonic-build = "0.11"
