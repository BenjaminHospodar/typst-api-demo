[package]
name    = "typst-compiler-svc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio          = { version = "1", features = ["full"] }
tonic          = "0.11"
tonic-health   = "0.11"
prost          = "0.12"
typst          = "0.12"
typst-pdf      = "0.12"
typst-assets   = { version = "0.12", features = ["fonts"] }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow         = "1"

[build-dependencies]
tonic-build = "0.11"
