apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pdfgen

resources:
  - ../../base
  - secrets.yaml

patches:
  - target:
      kind: Deployment
      name: java-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: rust-compiler
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: rust-compiler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8
