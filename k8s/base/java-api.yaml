apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api
  namespace: pdfgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-api
  template:
    metadata:
      labels:
        app: java-api
    spec:
      containers:
        - name: java-api
          image: typst-api-demo/java-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: PDFGEN_COMPILER_HOST
              value: rust-compiler
            - name: PDFGEN_COMPILER_PORT
              value: "50051"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: datasource-password
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: rabbitmq-password
            - name: SPRING_REDIS_HOST
              value: redis
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: redis-password
            - name: PDFGEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pdfgen-secrets
                  key: api-key
                  optional: true
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: java-api
  namespace: pdfgen
spec:
  selector:
    app: java-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
