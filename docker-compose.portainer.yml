services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdfgen
      POSTGRES_USER: pdfgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfgen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfgen"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  seeder:
    image: pdfgen-seeder:latest
    pull_policy: never
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfgen}
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  java-api:
    image: pdfgen-java-api:latest
    pull_policy: never
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pdfgen
      SPRING_DATASOURCE_USERNAME: pdfgen
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pdfgen}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      JAVA_OPTS: "-Xms512m -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  rust-compiler:
    image: pdfgen-rust-compiler:latest
    pull_policy: never
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_THREADS: "4"
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "3"
          memory: 512M
        reservations:
          cpus: "1"
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
